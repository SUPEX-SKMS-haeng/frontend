# Gemini Code PR 자동 리뷰
# shared-infra의 reusable workflow를 호출합니다.
name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    uses: agent-template-apps/shared-infra/.github/workflows/gemini-review-reusable.yml@main
    with:
      app_type: frontend
      app_name: frontend
    secrets: inherit
