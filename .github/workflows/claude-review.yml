# Claude Code PR 자동 리뷰
# shared-infra의 reusable workflow를 호출합니다.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    uses: agent-template-apps/shared-infra/.github/workflows/claude-review-reusable.yml@main
    with:
      app_type: frontend
      app_name: frontend
    secrets: inherit
